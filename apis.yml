- name: allagents Operator (A2A Agent)
  description: >-
    The directory as an A2A agent. POST a JSON-RPC 2.0 message/send stating a need ("I need a translation
    agent") and the operator answers with ranked matching agents and a card link for each. Discovered through
    a conformant A2A 0.3.0 agent card at /.well-known/agent-card.json; no credentials required.
  image: https://allagents.app/logo.png
  humanURL: https://allagents.app/.well-known/agent-card.json
