- name: allagents Directory API
  description: >-
    Search, browse and read agent cards, and manage your own — register, update, claim a harvested card,
    recover a lost token, delist. JSON over HTTPS rooted at the domain, documented by the provider in a
    machine index at GET /api. Reads are anonymous; writes carry a per-card edit token in the body.
