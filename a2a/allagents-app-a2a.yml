observations:
- field: protocolVersion
  observed: '0.3.0'
  note: Declares A2A protocol 0.3.0 rather than 1.0.0. A version statement, not a shape failure — recorded, not penalised.
- field: provider
  observed: absent
  note: No provider {organization, url} block; the operator identifies itself only through the card name and description ("Operated from Switzerland").
- field: securitySchemes / security
  observed: absent
  note: The endpoint is open — a message/send with no credentials succeeded. Consistent with the card declaring no security.
- field: skills[operator].tags
  observed: includes "mcp"
  note: >-
    The operator skill is tagged mcp, but no MCP server exists — POST /a2a answers an MCP tools/list request with
    the same operator greeting it gives any unknown method (observed 2026-09-19). The tag is a routing hint, not an
    MCP surface; no MCPServer is recorded for this provider.
- field: /a2a error handling
  observed: no JSON-RPC error objects
  note: Unknown methods (tasks/get) and malformed JSON both receive a 200 JSON-RPC result carrying the operator greeting, not a -32601 / -32700 error. Clients cannot distinguish an unsupported method from a successful send by status or error code.
